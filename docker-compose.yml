# Recruvault — self-host stack (also handy for local development).
#
# Services: the app, PostgreSQL, ClamAV (clamd), and MinIO as an
# S3-compatible object store for fully self-contained deployments. Point
# S3_ENDPOINT at real AWS S3 (ap-southeast-2) if you'd rather use AWS.
services:
  app:
    build:
      context: .
      args:
        TRUSTED_DOMAINS: ${TRUSTED_DOMAINS:-localhost}
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      TRUSTED_DOMAINS: ${TRUSTED_DOMAINS:-localhost}
      DATABASE_URL: postgres://recruvault:recruvault@db:5432/recruvault
      APP_URL: ${APP_URL:-http://localhost:3000}
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:?set BETTER_AUTH_SECRET}
      ALLOW_RECRUITER_SIGNUP: ${ALLOW_RECRUITER_SIGNUP:-false}
      # Self-managed master key (openssl rand -hex 32). No external KMS.
      LOCAL_KEK: ${LOCAL_KEK:?set LOCAL_KEK}
      AWS_REGION: ${AWS_REGION:-ap-southeast-2}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-recruvault}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-recruvault-secret}
      S3_BUCKET: ${S3_BUCKET:-recruvault-documents}
      S3_ENDPOINT: ${S3_ENDPOINT:-http://minio:9000}
      S3_FORCE_PATH_STYLE: "true"
      S3_SERVER_SIDE_ENCRYPTION: ${S3_SERVER_SIDE_ENCRYPTION:-false}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      RESEND_FROM_EMAIL: ${RESEND_FROM_EMAIL:-}
      RESEND_WEBHOOK_SECRET: ${RESEND_WEBHOOK_SECRET:-}
      SHARED_SENDING_DOMAIN: ${SHARED_SENDING_DOMAIN:-mail.recruvault.example}
      CLAMAV_HOST: clamav
      CLAMAV_PORT: "3310"
      SMS_ENABLED: ${SMS_ENABLED:-false}
      # Background jobs. Default: talk to the bundled Inngest dev server.
      # For Inngest Cloud, set INNGEST_DEV= (empty) plus the keys below.
      INNGEST_DEV: ${INNGEST_DEV:-http://inngest:8288}
      INNGEST_EVENT_KEY: ${INNGEST_EVENT_KEY:-}
      INNGEST_SIGNING_KEY: ${INNGEST_SIGNING_KEY:-}
    depends_on:
      migrate:
        condition: service_completed_successfully
      db:
        condition: service_healthy
      clamav:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully

  # One-shot: apply drizzle migrations and seed reference data, then exit. The app waits for this to
  # complete so it never starts against an unmigrated database.
  migrate:
    build:
      context: .
      target: migrate
    environment:
      DATABASE_URL: postgres://recruvault:recruvault@db:5432/recruvault
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  db:
    image: postgres:17.11-alpine@sha256:b0f9560a2de083e2cc7382e75f808c7381a32852a7ec49117deedb300e552b24
    environment:
      POSTGRES_USER: recruvault
      POSTGRES_PASSWORD: recruvault
      POSTGRES_DB: recruvault
    volumes:
      - db-data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U recruvault"]
      interval: 5s
      timeout: 5s
      retries: 10

  clamav:
    image: clamav/clamav:1.5.4@sha256:638d90201ee7ee6a82d249a2fc23b132e578673b5f1f2766852b127676ca1ef6
    volumes:
      - clamav-data:/var/lib/clamav
    healthcheck:
      # clamdcheck.sh pings clamd on TCP 3310; non-zero until the daemon has
      # finished loading signatures (can take minutes on first boot).
      test: ["CMD", "clamdcheck.sh"]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 300s

  # The upstream minio/minio images are no longer published on Docker Hub.
  # pgsty/minio is a community rebuild of the same server; any S3-compatible
  # store works if you point S3_ENDPOINT elsewhere.
  minio:
    image: pgsty/minio:RELEASE.2026-08-04T00-00-00Z@sha256:b6bfe7239bfc83fb90d31612d9704d86039dd714f7904b3f1ad68f211e602372
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-recruvault-admin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-recruvault-admin-secret}
    volumes:
      - minio-data:/data
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"

  # One-shot: create the private documents bucket and an app user that can
  # only reach that bucket. The app never holds the MinIO root credentials.
  minio-init:
    image: pgsty/mc:RELEASE.2026-09-16T00-00-00Z@sha256:cfc83108c3abb371f8fb84d99c1fdc88f8c237e022409b0081fb7c0a3be634dd
    depends_on:
      minio:
        condition: service_started
    environment:
      MINIO_USER: ${MINIO_ROOT_USER:-recruvault-admin}
      MINIO_PASS: ${MINIO_ROOT_PASSWORD:-recruvault-admin-secret}
      APP_KEY: ${AWS_ACCESS_KEY_ID:-recruvault}
      APP_SECRET: ${AWS_SECRET_ACCESS_KEY:-recruvault-secret}
      S3_BUCKET: ${S3_BUCKET:-recruvault-documents}
    entrypoint: >
      /bin/sh -ec "
      until mc alias set local http://minio:9000 \"$$MINIO_USER\" \"$$MINIO_PASS\" >/dev/null; do
        echo 'waiting for minio...'; sleep 2;
      done;
      mc mb --ignore-existing local/\"$$S3_BUCKET\";
      mc anonymous set none local/\"$$S3_BUCKET\";
      printf '{\"Version\":\"2012-10-17\",\"Statement\":[{\"Effect\":\"Allow\",\"Action\":[\"s3:GetObject\",\"s3:PutObject\",\"s3:DeleteObject\"],\"Resource\":[\"arn:aws:s3:::%s/*\"]},{\"Effect\":\"Allow\",\"Action\":[\"s3:ListBucket\",\"s3:GetBucketLocation\"],\"Resource\":[\"arn:aws:s3:::%s\"]}]}' \"$$S3_BUCKET\" \"$$S3_BUCKET\" > /tmp/recruvault-app.json;
      mc admin policy create local recruvault-app /tmp/recruvault-app.json;
      mc admin user add local \"$$APP_KEY\" \"$$APP_SECRET\" >/dev/null;
      mc admin policy attach local recruvault-app --user \"$$APP_KEY\" >/dev/null || true;
      echo 'minio bucket and app user ready';
      "
    restart: "no"

  # Inngest dev server: runs the async jobs (delivery, scanning, expiry
  # reminders, retention purge). For production, use Inngest Cloud instead
  # and remove this service.
  inngest:
    image: inngest/inngest:v1.46.0@sha256:9c4a2413bdbfa31a94ff54c32ae2dcc6613dbee84bc76db6cf6644d19e357e3e
    command: inngest dev -u http://app:3000/api/inngest --no-discovery
    ports:
      - "127.0.0.1:8288:8288"
    depends_on:
      app:
        condition: service_started

volumes:
  db-data:
  clamav-data:
  minio-data:
